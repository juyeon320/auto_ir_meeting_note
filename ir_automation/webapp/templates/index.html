<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 자동생성 — IR Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page">

  <header class="masthead">
    <div class="masthead__eyebrow">FORM · IR-NOTE</div>
    <h1 class="masthead__title">회의록 자동생성</h1>
    <p class="masthead__sub">클로바노트 녹취록을 넣으면 Q&amp;A 요약, 회의록, 이메일 초안까지 한 번에 정리해드립니다.</p>
  </header>

  <main class="deskgrid">

    <!-- 좌측: 입력 -->
    <section class="card intake" id="intakeCard">
      <h2 class="card__label">01 · 녹취록 업로드</h2>

      <label class="dropzone" id="dropzone" for="transcriptInput">
        <span class="dropzone__icon">＋</span>
        <span class="dropzone__text" id="dropzoneText">txt 파일을 끌어놓거나 클릭해서 선택</span>
      </label>
      <input type="file" id="transcriptInput" accept=".txt" hidden>

      <h2 class="card__label">02 · 미팅 정보</h2>

      <div class="field-grid">
        <label class="field">
          <span>일시</span>
          <input type="text" id="f_datetime" placeholder="2026년 08월 19일 오후 14시 00분 ~ 15시 30분">
        </label>
        <label class="field">
          <span>IR 형태</span>
          <input type="text" id="f_ir_type" placeholder="기업탐방" value="기업탐방">
        </label>
        <label class="field field--wide">
          <span>IR 대상기관</span>
          <input type="text" id="f_target_org" placeholder="OOO자산운용 OOO 선임 외 1인">
        </label>
        <label class="field">
          <span>참석인원</span>
          <input type="text" id="f_attendees" placeholder="Noel, Judy">
        </label>
        <label class="field">
          <span>특이사항</span>
          <input type="text" id="f_notes" placeholder="없음" value="없음">
        </label>
      </div>

      <h2 class="card__label">03 · 이메일 정보</h2>

      <div class="field-grid">
        <label class="field">
          <span>보내는 사람</span>
          <input type="text" id="f_sender_name" placeholder="Judy">
        </label>
        <label class="field">
          <span>파일명 (확장자 제외)</span>
          <input type="text" id="f_file_base" placeholder="260819 OOO자산운용 미팅">
        </label>
        <label class="field">
          <span>제목용 날짜 (예: 260819)</span>
          <input type="text" id="f_email_date_short" placeholder="260819">
        </label>
        <label class="field">
          <span>본문용 날짜/시간</span>
          <input type="text" id="f_email_date_long" placeholder="8월 19일 (수) 14시 00분">
        </label>
        <label class="field field--wide">
          <span>첨부파일명</span>
          <input type="text" id="f_attachment_base" placeholder="260819 OOO자산운용 미팅">
        </label>
      </div>

      <button class="btn-primary" id="submitBtn">
        <span id="submitBtnText">Q&amp;A 정리 시작</span>
      </button>
      <p class="error" id="errorMsg"></p>
    </section>

    <!-- 우측: 결과 -->
    <section class="card result" id="resultCard">
      <h2 class="card__label">결과</h2>

      <div class="result__empty" id="resultEmpty">
        <p>아직 생성된 문서가 없습니다.<br>왼쪽 정보를 채우고 시작 버튼을 눌러주세요.</p>
      </div>

      <div class="result__loading" id="resultLoading" hidden>
        <div class="spinner"></div>
        <p id="loadingText">녹취록을 읽는 중...</p>
      </div>

      <div class="result__done" id="resultDone" hidden>
        <div class="stamp" id="stamp">처리완료</div>

        <p class="result__meta" id="resultMetaText"></p>

        <h3 class="result__subhead">주요 논의 내용</h3>
        <ul class="topic-list" id="topicList"></ul>

        <h3 class="result__subhead">다운로드</h3>
        <div class="download-row">
          <a class="btn-download" id="downloadDocx" href="#" download>
            <span class="mono">.docx</span> 회의록
          </a>
          <a class="btn-download" id="downloadEmail" href="#" download>
            <span class="mono">.txt</span> 이메일 초안
          </a>
        </div>
      </div>

    </section>

  </main>

  <footer class="footer">로컬에서만 실행됩니다 · Q&amp;A 추출 시에만 Claude API로 텍스트가 전송됩니다.</footer>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
